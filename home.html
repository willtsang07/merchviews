<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MERCHVIEWS</title>

  <!-- DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: "DM Sans", sans-serif;
      background: #fff;
      color: #000;
    }

    html {
      scroll-behavior: smooth;
      scroll-snap-type: y mandatory;
    }

    body {
      overflow-y: auto;
    }

    .page {
      width: 100vw;
      min-height: 100vh;
    }

    /* =========================
       HERO
       ========================= */

    .hero {
      min-height: 100vh;
      scroll-snap-align: start;
      scroll-snap-stop: always;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 40px;
      text-align: center;
    }

    .hero h1 {
      margin: 0;

      font-size: clamp(2.5rem, 7vw, 5.5rem);
      line-height: 0.95;
      font-weight: 800;
      letter-spacing: -3px;
    }

    /* =========================
       IMAGE SECTION
       ========================= */

    .second-section {
      min-height: 100vh;
      scroll-snap-align: start;
      scroll-snap-stop: always;

      padding: 80px 0;

      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .second-image-grid {
      width: 100%;
      max-width: 1400px;

      padding: 0 30px;

      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    .second-image {
      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .second-image img {
      display: block;

      width: auto;
      height: auto;

      max-width: 100%;

      margin: 0 auto;
    }

    /* =========================
       STATUS MESSAGES
       ========================= */

    .loading,
    .empty,
    .error {
      width: 100%;

      text-align: center;

      padding: 40px 20px;

      font-size: 14px;
    }

    .error {
      color: #b00020;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      .hero {
        padding: 30px 18px;
      }

      .hero h1 {
        letter-spacing: -1.5px;
      }

      .second-section {
        padding: 60px 0;
      }

      .second-image-grid {
        gap: 16px;
        padding: 0 18px;
      }

      .second-image img {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- =========================
         HERO
         ========================= -->

    <section class="hero">
      <h1>MERCHVIEWS</h1>
    </section>


    <!-- =========================
         GITHUB CONTENT
         ========================= -->

    <section class="second-section">

      <div
        class="second-image-grid"
        id="imageGrid"
      >

        <div class="loading">
          Loading...
        </div>

      </div>

    </section>

  </main>


  <script>
    /* =========================
       GITHUB CONTENT API
       ========================= */

    const GITHUB_API =
      "https://api.github.com/repos/willtsang07/merchviews/contents/content";


    const imageGrid =
      document.getElementById("imageGrid");


    const IMAGE_EXTENSIONS = [
      ".jpg",
      ".jpeg",
      ".png",
      ".webp"
    ];


    /* =========================
       CHECK IF FILE IS AN IMAGE
       ========================= */

    function isImage(file) {

      const name =
        file.name.toLowerCase();

      return IMAGE_EXTENSIONS.some(
        extension =>
          name.endsWith(extension)
      );
    }


    /* =========================
       SORT IMAGES
       ========================= */

    function sortImages(a, b) {

      return a.name.localeCompare(
        b.name,
        undefined,
        {
          numeric: true,
          sensitivity: "base"
        }
      );
    }


    /* =========================
       LOAD GITHUB IMAGES
       ========================= */

    async function loadImages() {

      try {

        const response =
          await fetch(GITHUB_API);


        if (!response.ok) {

          throw new Error(
            "GitHub content could not be loaded."
          );
        }


        const files =
          await response.json();


        /*
         * Diagnostic information.
         * This can be viewed in the browser
         * Developer Tools console.
         */

        console.log(
          "GitHub files:",
          files
        );


        const images =
          files
            .filter(
              file =>
                file.type === "file" &&
                isImage(file)
            )
            .sort(sortImages);


        console.log(
          "Images found:",
          images
        );


        /* Clear Loading... */

        imageGrid.innerHTML = "";


        /* =========================
           NO IMAGES
           ========================= */

        if (images.length === 0) {

          imageGrid.innerHTML = `
            <div class="empty">
              No images have been uploaded yet.
            </div>
          `;

          return;
        }


        /* =========================
           CREATE IMAGE ELEMENTS
           ========================= */

        images.forEach(file => {

          const wrapper =
            document.createElement("div");


          wrapper.className =
            "second-image";


          const image =
            document.createElement("img");


          /*
           * GitHub provides the direct
           * downloadable image URL.
           */

          image.src =
            file.download_url;


          image.alt =
            file.name;


          /*
           * Lazy loading keeps Home
           * fast when there are many images.
           */

          image.loading =
            "lazy";


          /*
           * Diagnostic if an individual
           * image fails to load.
           */

          image.onerror = () => {

            console.error(
              "Could not load image:",
              file.name,
              file.download_url
            );
          };


          wrapper.appendChild(image);

          imageGrid.appendChild(wrapper);

        });


      } catch (error) {

        console.error(
          "GitHub image loading error:",
          error
        );


        imageGrid.innerHTML = `
          <div class="error">
            Unable to load images from GitHub.
          </div>
        `;
      }
    }


    /* =========================
       START
       ========================= */

    loadImages();

  </script>

</body>
</html>
