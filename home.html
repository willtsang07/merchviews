<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MERCHVIEWS</title>

  <!-- DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-snap-type: y mandatory;
    }

    body {
      margin: 0;
      font-family: "DM Sans", sans-serif;
      color: #111;
      background: #fff;
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      min-height: 100vh;
    }


    /* =========================
       LOGOUT BUTTON
    ========================= */

    .logout-button {
      position: fixed;

      top: 24px;
      right: 24px;

      width: 38px;
      height: 38px;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 0;

      border: 1px solid #000;
      border-radius: 50%;

      background: #fff;
      color: #000;

      cursor: pointer;

      z-index: 1000;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .logout-button:hover {
      background: #000;
      color: #fff;
    }

    .logout-button:active {
      transform: scale(0.94);
    }

    .logout-button svg {
      width: 17px;
      height: 17px;

      display: block;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 100vh;
      scroll-snap-align: start;
      scroll-snap-stop: always;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 40px;
      text-align: center;
    }

    .hero h1 {
      margin: 0;

      font-size: clamp(2.5rem, 7vw, 5.5rem);
      line-height: 0.95;
      font-weight: 800;
      letter-spacing: -3px;
    }


    /* =========================
       IMAGE SECTION
    ========================= */

    .second-section {
      min-height: 100vh;

      scroll-snap-align: start;
      scroll-snap-stop: always;

      padding: 80px 0;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      background: #fff;
    }

    /*
      IMPORTANT:
      Home intentionally uses ONE COLUMN.

      This preserves the original large-image layout.
    */

    .second-image-grid {
      width: 100%;
      max-width: 1400px;

      padding: 0 30px;

      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    .second-image {
      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    /*
      Images keep their natural proportions.

      They can shrink to fit the page width,
      but they are not cropped.
    */

    .second-image img {
      display: block;

      width: auto;
      height: auto;

      max-width: 100%;

      margin: 0 auto;
    }


    /* =========================
       STATUS MESSAGES
    ========================= */

    .status {
      width: 100%;
      text-align: center;

      padding: 40px 20px;

      font-size: 15px;
      color: #666;
    }

    .error {
      color: #b00020;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .hero {
        padding: 30px 18px;
      }

      .hero h1 {
        letter-spacing: -1.5px;
      }

      .second-section {
        padding: 60px 0;
      }

      .second-image-grid {
        gap: 16px;
        padding: 0 18px;
      }

      .second-image img {
        max-width: 100%;
      }

      .logout-button {
        top: 16px;
        right: 16px;

        width: 34px;
        height: 34px;
      }

      .logout-button svg {
        width: 15px;
        height: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGOUT BUTTON
  ========================= -->

  <button
    id="logout-button"
    class="logout-button"
    type="button"
    aria-label="Sign out"
    title="Sign out"
  >

    <svg
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <path
        d="M14 8V6C14 4.89543 13.1046 4 12 4H5C3.89543 4 3 4.89543 3 5V19C3 20.1046 3.89543 21 5 21H12C13.1046 21 14 20.1046 14 19V17"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <path
        d="M10 12H21"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <path
        d="M18 9L21 12L18 15"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>

  </button>


  <main class="page">

    <!-- HERO -->
    <section class="hero">
      <h1>MERCHVIEWS</h1>
    </section>


    <!-- IMAGES -->
    <section class="second-section">

      <div
        id="imageGrid"
        class="second-image-grid"
        aria-live="polite"
      >
        <div class="status">
          Loading images...
        </div>
      </div>

    </section>

  </main>


  <script>

    /* =========================
       SESSION / LOGOUT
    ========================= */

    const logoutButton =
      document.getElementById("logout-button");


    async function checkAuthentication() {

      try {

        const response =
          await fetch(
            "/.netlify/functions/check-session",
            {
              method: "GET",
              credentials: "include"
            }
          );

        const data =
          await response.json();


        /*
          Only show the sign-out icon
          when a valid session exists.
        */

        if (
          response.ok &&
          data.authenticated
        ) {

          logoutButton.style.display =
            "flex";

        }

      } catch (error) {

        console.error(
          "Unable to check authentication:",
          error
        );

      }

    }


    logoutButton.addEventListener(
      "click",
      async () => {

        try {

          const response =
            await fetch(
              "/.netlify/functions/logout",
              {
                method: "POST",
                credentials: "include"
              }
            );


          if (response.ok) {

            window.location.replace(
              "/home"
            );

          }

        } catch (error) {

          console.error(
            "Unable to sign out:",
            error
          );

        }

      }
    );


    /*
      Check authentication immediately.

      Home remains publicly accessible.
      This only determines whether the
      sign-out button should be displayed.
    */

    checkAuthentication();


    /*
      ==========================================
      GITHUB CONTENT SOURCE
      ==========================================
    */

    const GITHUB_API =
      "https://api.github.com/repos/willtsang07/merchviews/contents/content";

    const imageGrid =
      document.getElementById("imageGrid");

    const IMAGE_EXTENSIONS = [
      ".jpg",
      ".jpeg",
      ".png",
      ".webp"
    ];


    /*
      ==========================================
      CHECK IMAGE FILE
      ==========================================
    */

    function isImage(file) {

      const name =
        file.name.toLowerCase();

      return IMAGE_EXTENSIONS.some(
        extension =>
          name.endsWith(extension)
      );

    }


    /*
      ==========================================
      SORT IMAGES
      ==========================================
    */

    function sortImages(a, b) {

      return a.name.localeCompare(
        b.name,
        undefined,
        {
          numeric: true,
          sensitivity: "base"
        }
      );

    }


    /*
      ==========================================
      LOAD IMAGES FROM GITHUB
      ==========================================
    */

    async function loadImages() {

      try {

        const response =
          await fetch(
            GITHUB_API,
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "GitHub content could not be loaded."
          );

        }


        const files =
          await response.json();


        const images =
          files
            .filter(file =>
              file.type === "file" &&
              isImage(file)
            )
            .sort(sortImages);


        imageGrid.innerHTML = "";


        /*
          No images found
        */

        if (images.length === 0) {

          imageGrid.innerHTML = `
            <div class="status">
              No images have been uploaded yet.
            </div>
          `;

          return;

        }


        /*
          Create an image for every
          image inside /content
        */

        images.forEach(file => {

          const wrapper =
            document.createElement("div");

          wrapper.className =
            "second-image";


          const image =
            document.createElement("img");


          image.src =
            `${file.download_url}?v=${encodeURIComponent(file.sha)}`;


          image.alt =
            file.name;


          image.loading =
            "lazy";


          wrapper.appendChild(image);

          imageGrid.appendChild(wrapper);

        });

      }


      catch (error) {

        console.error(error);

        imageGrid.innerHTML = `
          <div class="status error">
            Unable to load images from GitHub.
          </div>
        `;

      }

    }


    /*
      ==========================================
      START
      ==========================================
    */

    loadImages();

  </script>

</body>
</html>
