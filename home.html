<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MERCHVIEWS</title>

  <!-- DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-snap-type: y mandatory;
    }

    body {
      margin: 0;
      font-family: "DM Sans", sans-serif;
      color: #111;
      background: #fff;
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      min-height: 100vh;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 100vh;
      scroll-snap-align: start;
      scroll-snap-stop: always;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 40px;
      text-align: center;
    }

    .hero h1 {
      margin: 0;

      font-size: clamp(2.5rem, 7vw, 5.5rem);
      line-height: 0.95;
      font-weight: 800;
      letter-spacing: -3px;
    }

    /* =========================
       IMAGE SECTION
    ========================= */

    .second-section {
      min-height: 100vh;

      scroll-snap-align: start;
      scroll-snap-stop: always;

      padding: 80px 0;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      background: #fff;
    }

    /*
      IMPORTANT:
      Home intentionally uses ONE COLUMN.

      This preserves the original large-image layout.
    */

    .second-image-grid {
      width: 100%;
      max-width: 1400px;

      padding: 0 30px;

      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    .second-image {
      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    /*
      Images keep their natural proportions.

      They can shrink to fit the page width,
      but they are not cropped.
    */

    .second-image img {
      display: block;

      width: auto;
      height: auto;

      max-width: 100%;

      margin: 0 auto;
    }

    /* =========================
       STATUS MESSAGES
    ========================= */

    .status {
      width: 100%;
      text-align: center;

      padding: 40px 20px;

      font-size: 15px;
      color: #666;
    }

    .error {
      color: #b00020;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .hero {
        padding: 30px 18px;
      }

      .hero h1 {
        letter-spacing: -1.5px;
      }

      .second-section {
        padding: 60px 0;
      }

      .second-image-grid {
        gap: 16px;
        padding: 0 18px;
      }

      .second-image img {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- HERO -->
    <section class="hero">
      <h1>MERCHVIEWS</h1>
    </section>


    <!-- IMAGES -->
    <section class="second-section">

      <div
        id="imageGrid"
        class="second-image-grid"
        aria-live="polite"
      >
        <div class="status">
          Loading images...
        </div>
      </div>

    </section>

  </main>


  <script>
    /*
      ==========================================
      GITHUB CONTENT SOURCE
      ==========================================
    */

    const GITHUB_API =
      "https://api.github.com/repos/willtsang07/merchviews/contents/content";

    const imageGrid = document.getElementById("imageGrid");

    const IMAGE_EXTENSIONS = [
      ".jpg",
      ".jpeg",
      ".png",
      ".webp"
    ];


    /*
      ==========================================
      CHECK IMAGE FILE
      ==========================================
    */

    function isImage(file) {
      const name = file.name.toLowerCase();

      return IMAGE_EXTENSIONS.some(extension =>
        name.endsWith(extension)
      );
    }


    /*
      ==========================================
      SORT IMAGES
      ==========================================

      This gives sensible ordering for filenames
      such as:

      image1
      image2
      image10

      rather than:

      image1
      image10
      image2
    */

    function sortImages(a, b) {
      return a.name.localeCompare(
        b.name,
        undefined,
        {
          numeric: true,
          sensitivity: "base"
        }
      );
    }


    /*
      ==========================================
      LOAD IMAGES FROM GITHUB
      ==========================================
    */

    async function loadImages() {

      try {

        const response = await fetch(
          GITHUB_API,
          {
            cache: "no-store"
          }
        );


        if (!response.ok) {
          throw new Error(
            "GitHub content could not be loaded."
          );
        }


        const files = await response.json();


        const images = files
          .filter(file =>
            file.type === "file" &&
            isImage(file)
          )
          .sort(sortImages);


        imageGrid.innerHTML = "";


        /*
          No images found
        */

        if (images.length === 0) {

          imageGrid.innerHTML = `
            <div class="status">
              No images have been uploaded yet.
            </div>
          `;

          return;
        }


        /*
          Create an image for every
          image inside /content
        */

        images.forEach(file => {

          const wrapper =
            document.createElement("div");

          wrapper.className = "second-image";


          const image =
            document.createElement("img");


          /*
            GitHub's download URL is used so
            the image itself comes directly
            from the repository.

            Adding the SHA helps prevent an
            old cached image from appearing
            after an update.
          */

          image.src =
            `${file.download_url}?v=${encodeURIComponent(file.sha)}`;


          image.alt = file.name;


          image.loading = "lazy";


          wrapper.appendChild(image);

          imageGrid.appendChild(wrapper);

        });

      }


      catch (error) {

        console.error(error);

        imageGrid.innerHTML = `
          <div class="status error">
            Unable to load images from GitHub.
          </div>
        `;

      }

    }


    /*
      ==========================================
      START
      ==========================================
    */

    loadImages();

  </script>

</body>
</html>
