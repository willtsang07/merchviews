<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MERCHVIEWS</title>

  <!-- DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================
       RESET
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: "DM Sans", sans-serif;
      font-optical-sizing: auto;
      font-style: normal;

      background: #f8fafc;
      color: #000;
    }


    /* =========================
       PAGE
    ========================= */

    .page {
      width: 100%;
      height: 100vh;

      overflow-y: auto;

      scroll-behavior: smooth;
    }


    /* =========================
       LOGOUT BUTTON
    ========================= */

    .logout-button {
      position: fixed;

      top: 24px;
      right: 24px;

      width: 38px;
      height: 38px;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 0;

      border: 1px solid #000;
      border-radius: 50%;

      background: #f8fafc;
      color: #000;

      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .logout-button:hover {
      background: #000;
      color: #f8fafc;
    }

    .logout-button:active {
      transform: scale(0.94);
    }

    .logout-button svg {
      width: 17px;
      height: 17px;

      display: block;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 100vh;

      padding: 40px 20px;

      text-align: center;

      background: #f8fafc;
    }

    .hero-content {
      width: 100%;
      max-width: 850px;

      margin: 0 auto;
    }

    h1 {
      margin-bottom: 35px;

      color: #000;

      font-size: clamp(2.5rem, 7vw, 5.5rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -3px;
    }


    /* =========================
       INPUT
    ========================= */

    .input-wrapper {
      width: 100%;
      max-width: 500px;

      margin: 0 auto;
    }

    .input-wrapper input {
      width: 48%;
      height: 35px;

      margin: 0 auto;

      padding: 0 30px;

      display: block;

      border: 1px solid #000;
      border-radius: 5px;

      outline: none;

      background: #f8fafc;
      color: #000;

      font-family: "DM Sans", sans-serif;
      font-size: 16px;
      font-weight: 400;

      text-align: center;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .input-wrapper input::placeholder {
      color: #000;
      opacity: 0.6;
    }

    .input-wrapper input:focus {
      border-color: #000;

      box-shadow:
        0 0 0 4px rgba(0, 0, 0, 0.08);
    }


    /* =========================
       CODE INPUT
    ========================= */

    .code-input {
      letter-spacing: 4px;
    }


    /* =========================
       STATUS MESSAGE
    ========================= */

    .status {
      width: 100%;
      margin-top: 20px;

      font-size: 14px;
      font-weight: 400;

      text-align: center;

      display: none;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .hero {
        padding: 10px 18px;
      }

      h1 {
        letter-spacing: -1.5px;
      }

      .input-wrapper input {
        width: 48%;
        height: 30px;

        margin: 0 auto;

        padding: 0 28px;
      }

      .logout-button {
        top: 16px;
        right: 16px;

        width: 34px;
        height: 34px;
      }

      .logout-button svg {
        width: 15px;
        height: 15px;
      }

    }

  </style>
</head>


<body>

  <!-- =========================
       LOGOUT BUTTON
  ========================= -->

  <button
    id="logout-button"
    class="logout-button"
    type="button"
    aria-label="Sign out"
    title="Sign out"
  >

    <!-- Log-out icon -->
    <svg
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <path
        d="M14 8V6C14 4.89543 13.1046 4 12 4H5C3.89543 4 3 4.89543 3 5V19C3 20.1046 3.89543 21 5 21H12C13.1046 21 14 20.1046 14 19V17"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <path
        d="M10 12H21"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <path
        d="M18 9L21 12L18 15"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>

  </button>


  <main class="page">

    <!-- =========================
         HERO SECTION
    ========================= -->

    <section class="hero">

      <div class="hero-content">

        <h1>
          MERCHVIEWS
        </h1>


        <!-- =========================
             EMAIL STEP
        ========================= -->

        <form id="email-form">

          <div class="input-wrapper">

            <input
              id="email-input"
              type="email"
              placeholder="email"
              aria-label="Email Address"
              autocomplete="email"
              required
            />

          </div>

        </form>


        <!-- =========================
             CODE STEP
        ========================= -->

        <form
          id="code-form"
          style="display: none;"
        >

          <div class="input-wrapper">

            <input
              id="code-input"
              class="code-input"
              type="text"
              inputmode="numeric"
              pattern="[0-9]{6}"
              maxlength="6"
              placeholder="code"
              aria-label="6-digit login code"
              autocomplete="one-time-code"
            />

          </div>

        </form>


        <!-- =========================
             STATUS
        ========================= -->

        <div
          id="status"
          class="status"
          aria-live="polite"
        ></div>

      </div>

    </section>

  </main>


  <script>

    const emailForm =
      document.getElementById("email-form");

    const codeForm =
      document.getElementById("code-form");

    const emailInput =
      document.querySelector("#email-form input");

    const codeInput =
      document.querySelector("#code-form input");

    const logoutButton =
      document.getElementById("logout-button");

    let userEmail = "";


    /* =========================
       CHECK CURRENT SESSION
    ========================= */

    async function checkAuthentication() {

      try {

        const response =
          await fetch(
            "/.netlify/functions/check-session",
            {
              method: "GET",
              credentials: "include"
            }
          );

        const data =
          await response.json();

        if (
          response.ok &&
          data.authenticated
        ) {

          /*
            A valid session exists,
            so show the sign-out button.
          */

          logoutButton.style.display =
            "flex";

        }

      } catch (error) {

        console.error(
          "Unable to check authentication:",
          error
        );

      }

    }


    /* =========================
       SIGN OUT
    ========================= */

    logoutButton.addEventListener(
      "click",
      async () => {

        try {

          const response =
            await fetch(
              "/.netlify/functions/logout",
              {
                method: "POST",
                credentials: "include"
              }
            );

          if (response.ok) {

            window.location.replace(
              "/login"
            );

          }

        } catch (error) {

          console.error(
            "Unable to sign out:",
            error
          );

        }

      }
    );


    /* =========================
       SEND LOGIN CODE
    ========================= */

    emailForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        userEmail =
          emailInput.value
            .trim()
            .toLowerCase();

        if (!userEmail) {
          return;
        }

        try {

          const response =
            await fetch(
              "/.netlify/functions/send-code",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  email: userEmail
                })
              }
            );

          const data =
            await response.json();

          if (!response.ok) {

            console.error(data);

            return;

          }

          /*
            Move to the code screen.

            The server intentionally returns success
            even when an email isn't approved, so the
            login page does not reveal which addresses
            are allowed.
          */

          emailForm.style.display =
            "none";

          codeForm.style.display =
            "block";

          codeInput.focus();

        } catch (error) {

          console.error(
            "Unable to send login code:",
            error
          );

        }

      }
    );


    /* =========================
       VERIFY LOGIN CODE
    ========================= */

    codeForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        const code =
          codeInput.value.trim();

        if (!/^\d{6}$/.test(code)) {
          return;
        }

        try {

          const response =
            await fetch(
              "/.netlify/functions/verify-code",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  email: userEmail,
                  code: code
                })
              }
            );

          const data =
            await response.json();

          if (!response.ok) {

            console.error(data);

            return;

          }

          if (data.success) {

            console.log(
              "Login successful."
            );

            window.location.href =
              "/upload";

          }

        } catch (error) {

          console.error(
            "Unable to verify login code:",
            error
          );

        }

      }
    );


    /* =========================
       INITIALIZE
    ========================= */

    checkAuthentication();

  </script>

</body>
</html>
