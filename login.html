<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MERCHVIEWS</title>

  <!-- DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================
       RESET
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: "DM Sans", sans-serif;
      font-optical-sizing: auto;
      font-style: normal;

      background: #f8fafc;
      color: #000;
    }


    /* =========================
       PAGE
    ========================= */

    .page {
      width: 100%;
      height: 100vh;

      overflow-y: auto;

      scroll-behavior: smooth;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 100vh;

      padding: 40px 20px;

      text-align: center;

      background: #f8fafc;
    }

    .hero-content {
      width: 100%;
      max-width: 850px;

      margin: 0 auto;
    }

    h1 {
      margin-bottom: 35px;

      color: #000;

      font-size: clamp(2.5rem, 7vw, 5.5rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -3px;
    }


    /* =========================
       INPUT
    ========================= */

    .input-wrapper {
      width: 100%;
      max-width: 500px;

      margin: 0 auto;
    }

    .input-wrapper input {
      width: 48%;
      height: 35px;

      margin: 0 auto;

      padding: 0 30px;

      display: block;

      border: 1px solid #000;
      border-radius: 5px;

      outline: none;

      background: #f8fafc;
      color: #000;

      font-family: "DM Sans", sans-serif;
      font-size: 16px;
      font-weight: 400;

      text-align: center;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .input-wrapper input::placeholder {
      color: #000;
      opacity: 0.6;
    }

    .input-wrapper input:focus {
      border-color: #000;

      box-shadow:
        0 0 0 4px rgba(0, 0, 0, 0.08);
    }


    /* =========================
       CODE INPUT
    ========================= */

    .code-input {
      letter-spacing: 4px;
    }


    /* =========================
       STATUS MESSAGE
    ========================= */

    .status {
      width: 100%;
      margin-top: 20px;

      font-size: 14px;
      font-weight: 400;

      text-align: center;

      display: none;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .hero {
        padding: 10px 18px;
      }

      h1 {
        letter-spacing: -1.5px;
      }

      .input-wrapper input {
        width: 48%;
        height: 30px;

        margin: 0 auto;

        padding: 0 28px;
      }

    }

  </style>
</head>


<body>

  <main class="page">

    <!-- =========================
         HERO SECTION
    ========================= -->

    <section class="hero">

      <div class="hero-content">

        <h1>
          MERCHVIEWS
        </h1>


        <!-- =========================
             EMAIL STEP
        ========================= -->

        <form id="email-form">

          <div class="input-wrapper">

            <input
              id="email-input"
              type="email"
              placeholder="email"
              aria-label="Email Address"
              autocomplete="email"
              required
            />

          </div>

        </form>


        <!-- =========================
             CODE STEP
        ========================= -->

        <form
          id="code-form"
          style="display: none;"
        >

          <div class="input-wrapper">

            <input
              id="code-input"
              class="code-input"
              type="text"
              inputmode="numeric"
              pattern="[0-9]{6}"
              maxlength="6"
              placeholder="code"
              aria-label="6-digit login code"
              autocomplete="one-time-code"
            />

          </div>

        </form>


        <!-- =========================
             STATUS
        ========================= -->

        <div
          id="status"
          class="status"
          aria-live="polite"
        ></div>

      </div>

    </section>

  </main>


  <script>

    /* =========================
       ELEMENTS
    ========================= */

    const emailForm = document.getElementById("email-form");
    const codeForm = document.getElementById("code-form");

    const emailInput = document.getElementById("email-input");
    const codeInput = document.getElementById("code-input");

    const status = document.getElementById("status");


    /* =========================
       USER EMAIL
    ========================= */

    let userEmail = "";


    /* =========================
       EMAIL SUBMISSION
    ========================= */

    emailForm.addEventListener("submit", function(event) {

      event.preventDefault();

      userEmail = emailInput.value.trim().toLowerCase();

      if (!userEmail) {
        return;
      }

      /*
       * STEP 1 ONLY
       *
       * The email is currently stored locally.
       *
       * In Step 2, this submission will call
       * the Netlify function that sends the
       * login code through Resend.
       */

      console.log("Email submitted:", userEmail);


      /* Hide email input */
      emailForm.style.display = "none";


      /* Show code input */
      codeForm.style.display = "block";


      /* Focus code input */
      codeInput.focus();

    });


    /* =========================
       CODE SUBMISSION
    ========================= */

    codeForm.addEventListener("submit", function(event) {

      event.preventDefault();

      const code = codeInput.value.trim();

      if (!/^\d{6}$/.test(code)) {
        return;
      }

      /*
       * STEP 4
       *
       * Code verification will be
       * connected here later.
       */

      console.log("Code submitted:", code);
      console.log("Email:", userEmail);

    });

  </script>

</body>
</html>
