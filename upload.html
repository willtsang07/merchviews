<html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MERCHVIEWS — Upload</title>

  <!-- DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: "DM Sans", sans-serif;
      background: #f8fafc;
      color: #000;
    }

    body {
      min-height: 100vh;
    }

    .hero {
      width: 100%;
      height: 100vh;
      min-height: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .title {
      margin: 0 0 45px;
      font-size: clamp(48px, 8vw, 120px);
      line-height: 0.95;
      font-weight: 500;
      letter-spacing: -0.06em;
      text-align: center;
    }

    .upload-wrapper {
      width: 48%;
      max-width: 700px;
    }

    #uploadButton {
      width: 100%;
      height: 55px;
      padding: 0 20px;
      border: 1px solid #000;
      border-radius: 5px;
      background: transparent;
      color: #000;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
    }

    #uploadButton:hover {
      background: #000;
      color: #fff;
    }

    #uploadButton:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    #imageUpload {
      display: none;
    }

    @media (max-width: 700px) {
      .hero {
        padding: 20px;
      }

      .title {
        margin-bottom: 35px;
      }

      .upload-wrapper {
        width: 48%;
      }

      #uploadButton {
        height: 50px;
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="hero">

    <h1 class="title">MERCHVIEWS</h1>

    <div class="upload-wrapper">
      <input
        id="imageUpload"
        type="file"
        accept="image/png,image/jpeg,image/webp"
      />

      <button id="uploadButton" type="button">
        Upload Image
      </button>
    </div>

  </main>

  <script>
    const imageUpload = document.getElementById("imageUpload");
    const uploadButton = document.getElementById("uploadButton");

    const MAX_FILE_SIZE = 10 * 1024 * 1024;

    const ALLOWED_TYPES = [
      "image/png",
      "image/jpeg",
      "image/webp"
    ];

    uploadButton.addEventListener("click", () => {
      imageUpload.click();
    });

    imageUpload.addEventListener("change", async () => {
      const file = imageUpload.files[0];

      if (!file) {
        return;
      }

      if (!ALLOWED_TYPES.includes(file.type)) {
        alert("Only PNG, JPEG, and WebP images are allowed.");
        imageUpload.value = "";
        return;
      }

      if (file.size > MAX_FILE_SIZE) {
        alert("Image is too large. Maximum size is 10 MB.");
        imageUpload.value = "";
        return;
      }

      uploadButton.disabled = true;
      uploadButton.textContent = "Uploading...";

      try {
        const formData = new FormData();

        formData.append("image", file);

        const response = await fetch(
          "/.netlify/functions/upload-image",
          {
            method: "POST",
            body: formData
          }
        );

        /*
         * Get the response as text first.
         * This makes debugging much easier if Netlify
         * returns an empty or non-JSON response.
         */
        const responseText = await response.text();

        let data;

        try {
          data = JSON.parse(responseText);
        } catch (jsonError) {
          console.error("Invalid JSON response:", responseText);

          throw new Error(
            "The server returned an invalid response. " +
            "Check the Netlify function logs."
          );
        }

        if (!response.ok) {
          throw new Error(
            data.error || "Image upload failed."
          );
        }

        if (!data.success) {
          throw new Error(
            data.error || "Image upload failed."
          );
        }

        console.log("Upload successful:", data);

        alert("Image uploaded successfully.");

      } catch (error) {
        console.error("Upload error:", error);

        alert(error.message);

      } finally {
        uploadButton.disabled = false;
        uploadButton.textContent = "Upload Image";
        imageUpload.value = "";
      }
    });
  </script>

</body>
</html>
