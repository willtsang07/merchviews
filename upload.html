<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MERCHVIEWS</title>

  <!-- DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================
       RESET
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: "DM Sans", sans-serif;
      font-optical-sizing: auto;
      font-style: normal;

      background: #f8fafc;
      color: #000;
    }


    /* =========================
       PAGE
    ========================= */

    .page {
      width: 100%;
      height: 100vh;

      overflow-y: auto;

      scroll-behavior: smooth;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 100vh;

      padding: 40px 20px;

      text-align: center;

      background: #f8fafc;
    }

    .hero-content {
      width: 100%;
      max-width: 850px;

      margin: 0 auto;
    }

    h1 {
      margin-bottom: 35px;

      color: #000;

      font-size: clamp(2.5rem, 7vw, 5.5rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -3px;
    }


    /* =========================
       IMAGE UPLOAD
    ========================= */

    .input-wrapper {
      width: 100%;
      max-width: 500px;

      margin: 0 auto;
    }

    .upload-button {
      width: 48%;
      height: 35px;

      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid #000;
      border-radius: 5px;

      outline: none;

      background: #f8fafc;
      color: #000;

      font-family: "DM Sans", sans-serif;
      font-size: 16px;
      font-weight: 400;

      text-align: center;

      cursor: pointer;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .upload-button:hover {
      box-shadow:
        0 0 0 4px rgba(0, 0, 0, 0.08);
    }

    .upload-button:focus-within {
      border-color: #000;

      box-shadow:
        0 0 0 4px rgba(0, 0, 0, 0.08);
    }

    .upload-button input {
      display: none;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .hero {
        padding: 10px 18px;
      }

      h1 {
        letter-spacing: -1.5px;
      }

      .upload-button {
        width: 48%;
        height: 30px;

        margin: 0 auto;
      }

    }

  </style>
</head>


<body>

  <main class="page">

    <!-- =========================
         HERO SECTION
    ========================= -->

    <section class="hero">

      <div class="hero-content">

        <h1>
          MERCHVIEWS
        </h1>

        <div class="input-wrapper">

          <label class="upload-button">
            upload

            <input
              id="imageUpload"
              type="file"
              accept="image/*"
            />

          </label>

        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       IMAGE STORAGE
  ========================= -->

  <script>

    const imageUpload = document.getElementById("imageUpload");

    imageUpload.addEventListener("change", function () {

      const file = this.files[0];

      if (!file) {
        return;
      }

      if (!file.type.startsWith("image/")) {
        alert("Please select an image.");
        this.value = "";
        return;
      }

      const reader = new FileReader();

      reader.onload = function (event) {

        const images = JSON.parse(
          localStorage.getItem("merchviewsImages") || "[]"
        );

        images.push(event.target.result);

        localStorage.setItem(
          "merchviewsImages",
          JSON.stringify(images)
        );

        // Reset the input so another upload can be made
        imageUpload.value = "";

      };

      reader.readAsDataURL(file);

    });

  </script>

</body>
</html>
