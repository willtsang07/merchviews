<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MERCHVIEWS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: "DM Sans", sans-serif;
      background: #fff;
      color: #000;
    }

    body {
      min-height: 100vh;
    }

    .upload-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      text-align: center;
    }

    .title {
      margin: 0;
      font-size: clamp(48px, 8vw, 120px);
      line-height: 0.9;
      font-weight: 500;
      letter-spacing: -0.06em;
    }

    .upload-wrapper {
      width: 48%;
      max-width: 700px;
      margin-top: 60px;
    }

    #fileInput {
      display: none;
    }

    .upload-button {
      width: 100%;
      padding: 18px 24px;
      border: 1px solid #000;
      background: #fff;
      color: #000;
      font-family: "DM Sans", sans-serif;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .upload-button:hover {
      background: #000;
      color: #fff;
    }

    .selected-file {
      margin-top: 20px;
      min-height: 20px;
      font-size: 14px;
    }

    .instructions {
      margin-top: 30px;
      font-size: 14px;
      line-height: 1.6;
      color: #555;
    }

    .github-button {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 18px 24px;
      border: 1px solid #000;
      background: #000;
      color: #fff;
      font-family: "DM Sans", sans-serif;
      font-size: 16px;
      text-decoration: none;
      cursor: pointer;
    }

    .github-button:hover {
      background: #fff;
      color: #000;
    }

    .reset-button {
      display: none;
      margin-top: 16px;
      border: 0;
      background: none;
      font-family: "DM Sans", sans-serif;
      font-size: 14px;
      text-decoration: underline;
      cursor: pointer;
      color: #555;
    }

    .step {
      display: none;
      margin-top: 28px;
      font-size: 14px;
      line-height: 1.5;
    }

    .step strong {
      color: #000;
    }

    @media (max-width: 600px) {
      .upload-page {
        padding: 30px 18px;
      }

      .title {
        letter-spacing: -0.04em;
      }

      .upload-wrapper {
        width: 100%;
        margin-top: 45px;
      }
    }
  </style>
</head>

<body>

  <main class="upload-page">

    <h1 class="title">MERCHVIEWS</h1>

    <div class="upload-wrapper">

      <input
        type="file"
        id="fileInput"
        accept="image/png,image/jpeg,image/webp"
      />

      <button class="upload-button" id="uploadButton">
        Select Image
      </button>

      <div class="selected-file" id="selectedFile"></div>

      <a
        class="github-button"
        id="githubButton"
        href="https://github.com/willtsang07/merchviews/upload/main/content"
        target="_blank"
        rel="noopener noreferrer"
      >
        Open GitHub Upload
      </a>

      <button class="reset-button" id="resetButton">
        Choose another image
      </button>

      <div class="step" id="stepText">
        On GitHub, drag your selected image into the upload area,
        then click <strong>Commit changes</strong>.
      </div>

      <div class="instructions">
        Images uploaded to GitHub's <strong>content</strong> folder
        will automatically appear on Home and Archive.
      </div>

    </div>

  </main>

  <script>
    const fileInput = document.getElementById("fileInput");
    const uploadButton = document.getElementById("uploadButton");
    const selectedFile = document.getElementById("selectedFile");
    const githubButton = document.getElementById("githubButton");
    const resetButton = document.getElementById("resetButton");
    const stepText = document.getElementById("stepText");

    const MAX_FILE_SIZE = 10 * 1024 * 1024;

    const ALLOWED_TYPES = [
      "image/png",
      "image/jpeg",
      "image/webp"
    ];

    uploadButton.addEventListener("click", () => {
      fileInput.click();
    });

    fileInput.addEventListener("change", () => {

      const file = fileInput.files[0];

      if (!file) {
        return;
      }

      if (!ALLOWED_TYPES.includes(file.type)) {
        alert("Please select a PNG, JPEG, or WebP image.");
        fileInput.value = "";
        return;
      }

      if (file.size > MAX_FILE_SIZE) {
        alert("Please select an image smaller than 10MB.");
        fileInput.value = "";
        return;
      }

      selectedFile.textContent =
        "Selected: " + file.name;

      uploadButton.textContent = "Image Ready";

      githubButton.style.display = "block";
      resetButton.style.display = "inline-block";
      stepText.style.display = "block";
    });

    resetButton.addEventListener("click", () => {

      fileInput.value = "";

      selectedFile.textContent = "";

      uploadButton.textContent = "Select Image";

      githubButton.style.display = "none";
      resetButton.style.display = "none";
      stepText.style.display = "none";
    });
  </script>

</body>
</html>
