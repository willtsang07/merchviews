<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MERCHVIEWS — Upload</title>

  <!-- DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
    }


    body {

      min-height: 100vh;

      font-family: "DM Sans", sans-serif;

      color: #111;
      background: #fff;

      overflow-x: hidden;

    }


    /* =========================
       HERO
    ========================= */

    .hero {

      min-height: 100vh;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 40px 20px;

    }


    .upload-container {

      width: 48%;
      max-width: 700px;

      text-align: center;

    }


    /* =========================
       TITLE
    ========================= */

    h1 {

      margin: 0 0 50px;

      font-size: clamp(
        48px,
        8vw,
        120px
      );

      line-height: 0.9;

      font-weight: 500;

      letter-spacing: -0.06em;

    }


    /* =========================
       FILE INPUT
    ========================= */

    .file-input {

      position: absolute;

      width: 1px;
      height: 1px;

      padding: 0;
      margin: -1px;

      overflow: hidden;

      clip: rect(0, 0, 0, 0);

      white-space: nowrap;

      border: 0;

    }


    /* =========================
       BUTTON
    ========================= */

    .button {

      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-height: 52px;

      padding: 14px 28px;

      border: 1px solid #111;

      background: transparent;

      color: #111;

      font-family: inherit;

      font-size: 15px;

      font-weight: 500;

      text-decoration: none;

      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease;

    }


    .button:hover {

      background: #111;

      color: #fff;

    }


    .button.primary {

      background: #111;

      color: #fff;

    }


    .button.primary:hover {

      background: #fff;

      color: #111;

    }


    /* =========================
       FILE NAME
    ========================= */

    .file-name {

      margin-top: 20px;

      font-size: 14px;

      color: #666;

      min-height: 20px;

    }


    /* =========================
       INSTRUCTIONS
    ========================= */

    .instructions {

      display: none;

      margin-top: 40px;

      padding-top: 30px;

      border-top: 1px solid #ddd;

    }


    .instructions.visible {

      display: block;

    }


    .instructions p {

      margin: 0 0 18px;

      font-size: 14px;

      line-height: 1.6;

      color: #555;

    }


    .instructions strong {

      color: #111;

    }


    .button-row {

      display: flex;

      justify-content: center;

      gap: 12px;

      flex-wrap: wrap;

    }


    /* =========================
       RESET
    ========================= */

    .reset {

      display: none;

      margin-top: 18px;

      border: 0;

      padding: 0;

      background: none;

      font-family: inherit;

      font-size: 13px;

      color: #777;

      cursor: pointer;

      text-decoration: underline;

      text-underline-offset: 3px;

    }


    .reset.visible {

      display: inline-block;

    }


    .error {

      margin-top: 20px;

      font-size: 14px;

      color: #b00020;

      display: none;

    }


    .error.visible {

      display: block;

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .hero {

        padding: 30px 18px;

      }


      .upload-container {

        width: 100%;

      }


      h1 {

        margin-bottom: 40px;

      }

    }

  </style>
</head>

<body>


  <main class="hero">

    <div class="upload-container">

      <h1>
        MERCHVIEWS
      </h1>


      <!--
        The browser file picker is only used
        to confirm/select the image.

        The actual upload happens through
        GitHub's own upload interface.
      -->

      <input
        id="fileInput"
        class="file-input"
        type="file"
        accept="image/png,image/jpeg,image/webp"
      />


      <label
        for="fileInput"
        class="button"
        id="chooseButton"
      >
        Choose Image
      </label>


      <div
        id="fileName"
        class="file-name"
      ></div>


      <div
        id="error"
        class="error"
      ></div>


      <!--
        Instructions become visible after
        the user selects an image.
      -->

      <div
        id="instructions"
        class="instructions"
      >

        <p>
          <strong>Next step:</strong>
          GitHub will open its upload page.
          Drag the image you just selected
          into the upload area.
        </p>


        <p>
          Make sure the file is being uploaded
          to the <strong>content</strong> folder,
          then click <strong>Commit changes</strong>.
        </p>


        <div class="button-row">

          <a
            id="githubButton"
            class="button primary"
            href="https://github.com/willtsang07/merchviews/upload/main/content"
            target="_blank"
            rel="noopener noreferrer"
          >
            Open GitHub Upload
          </a>

        </div>


        <button
          id="resetButton"
          class="reset"
          type="button"
        >
          Choose another image
        </button>

      </div>

    </div>

  </main>


  <script>

    /*
      ==========================================
      ELEMENTS
      ==========================================
    */

    const fileInput =
      document.getElementById("fileInput");

    const fileName =
      document.getElementById("fileName");

    const instructions =
      document.getElementById("instructions");

    const resetButton =
      document.getElementById("resetButton");

    const error =
      document.getElementById("error");


    /*
      ==========================================
      SETTINGS
      ==========================================
    */

    const MAX_FILE_SIZE =
      10 * 1024 * 1024;

    const ALLOWED_TYPES = [
      "image/png",
      "image/jpeg",
      "image/webp"
    ];


    /*
      ==========================================
      FILE SELECTION
      ==========================================
    */

    fileInput.addEventListener(
      "change",
      function () {

        error.textContent = "";
        error.classList.remove("visible");


        const file =
          fileInput.files[0];


        if (!file) {
          return;
        }


        /*
          Check file type
        */

        if (
          !ALLOWED_TYPES.includes(
            file.type
          )
        ) {

          showError(
            "Please choose a PNG, JPEG, or WebP image."
          );

          reset();

          return;

        }


        /*
          Check file size
        */

        if (
          file.size > MAX_FILE_SIZE
        ) {

          showError(
            "The image must be smaller than 10 MB."
          );

          reset();

          return;

        }


        /*
          Display filename
        */

        fileName.textContent =
          file.name;


        /*
          Show GitHub instructions
        */

        instructions.classList.add(
          "visible"
        );


        resetButton.classList.add(
          "visible"
        );

      }
    );


    /*
      ==========================================
      ERROR
      ==========================================
    */

    function showError(message) {

      error.textContent =
        message;

      error.classList.add(
        "visible"
      );

    }


    /*
      ==========================================
      RESET
      ==========================================
    */

    function reset() {

      fileInput.value = "";

      fileName.textContent = "";

      instructions.classList.remove(
        "visible"
      );

      resetButton.classList.remove(
        "visible"
      );

    }


    resetButton.addEventListener(
      "click",
      reset
    );

  </script>

</body>
</html>
