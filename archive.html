<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MERCHVIEWS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: "DM Sans", sans-serif;
      background: #fff;
      color: #000;
    }

    html {
      scroll-behavior: smooth;
      scroll-snap-type: y mandatory;
    }

    body {
      overflow-y: auto;
    }

    .page {
      width: 100vw;
      min-height: 100vh;
    }

    .hero,
    .third-section {
      min-height: 100vh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    .hero {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
      text-align: center;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(2.5rem, 7vw, 5.5rem);
      line-height: 0.95;
      font-weight: 800;
      letter-spacing: -3px;
    }

    .third-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 80px 0;
      background: #f8fafc;
    }

    .section-label {
      margin: 0;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .third-image-grid {
      width: 100%;
      max-width: 1400px;
      margin: 60px auto 0;
      padding: 0 30px;

      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
    }

    .third-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #fff;
    }

    .third-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .loading,
    .empty,
    .error {
      grid-column: 1 / -1;
      width: 100%;
      text-align: center;
      padding: 40px 20px;
      font-size: 14px;
    }

    .error {
      color: #b00020;
    }

    @media (max-width: 1000px) {

      .third-image-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 600px) {

      .hero {
        padding: 30px 18px;
      }

      .hero h1 {
        letter-spacing: -1.5px;
      }

      .third-section {
        padding: 60px 0;
      }

      .third-image-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        padding: 0 18px;
        margin-top: 40px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="hero">
      <h1>MERCHVIEWS</h1>
    </section>

    <section class="third-section">

      <h2 class="section-label">
        Discover
      </h2>

      <div
        class="third-image-grid"
        id="imageGrid"
      >
        <div class="loading">
          Loading...
        </div>
      </div>

    </section>

  </main>

  <script>
    const GITHUB_API =
      "https://api.github.com/repos/willtsang07/merchviews/contents/content";

    const imageGrid =
      document.getElementById("imageGrid");

    const IMAGE_EXTENSIONS = [
      ".jpg",
      ".jpeg",
      ".png",
      ".webp"
    ];

    function isImage(file) {

      const name =
        file.name.toLowerCase();

      return IMAGE_EXTENSIONS.some(
        extension => name.endsWith(extension)
      );
    }

    function sortImages(a, b) {

      return a.name.localeCompare(
        b.name,
        undefined,
        {
          numeric: true,
          sensitivity: "base"
        }
      );
    }

    async function loadImages() {

      try {

        const response =
          await fetch(GITHUB_API);

        if (!response.ok) {
          throw new Error(
            "GitHub content could not be loaded."
          );
        }

        const files =
          await response.json();

        const images =
          files
            .filter(
              file =>
                file.type === "file" &&
                isImage(file)
            )
            .sort(sortImages);

        imageGrid.innerHTML = "";

        if (images.length === 0) {

          imageGrid.innerHTML = `
            <div class="empty">
              No images have been uploaded yet.
            </div>
          `;

          return;
        }

        images.forEach(file => {

          const wrapper =
            document.createElement("div");

          wrapper.className =
            "third-image";

          const image =
            document.createElement("img");

          image.src =
            file.download_url;

          image.alt =
            file.name;

          image.loading =
            "lazy";

          wrapper.appendChild(image);

          imageGrid.appendChild(wrapper);
        });

      } catch (error) {

        console.error(error);

        imageGrid.innerHTML = `
          <div class="error">
            Unable to load images from GitHub.
          </div>
        `;
      }
    }

    loadImages();
  </script>

</body>
</html>
